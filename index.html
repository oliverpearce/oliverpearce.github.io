<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oliver Pearce — Terminal Portfolio</title>

  <!--
    We use Google Fonts to load "JetBrains Mono", a monospace font designed
    for code editors. Monospace means every character is the same width, which
    is what makes the terminal alignment look correct.

    The two <link rel="preconnect"> tags tell the browser to open a connection
    to Google's font servers BEFORE it actually needs the font file — this is
    called a "preconnect hint" and it shaves ~100ms off the font load time
    because the TCP handshake is already done by the time the font is requested.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!--
    CSS is loaded in a specific order because later files can reference
    variables defined in earlier ones:

      reset.css    → strips browser default styles (margins, padding, etc.)
      theme.css    → defines CSS custom properties like --color-green
      terminal.css → uses those custom properties for all the actual styling
      animations.css → uses the same custom properties for keyframes

    If you loaded terminal.css before theme.css, the variables wouldn't exist
    yet and everything would fall back to their initial values (usually nothing).
  -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!--
    This div creates the CRT scanline effect you see on old monitors.
    It uses aria-hidden="true" which tells screen readers (assistive technology
    for visually impaired users) to completely ignore this element — because
    it's purely decorative and has no meaningful content.

    The actual scanline stripes are created with CSS (a repeating gradient),
    not an image, so there's nothing to download.
  -->
  <div class="scanlines" aria-hidden="true"></div>

  <!--
    <main> is a semantic HTML element that marks the primary content of the page.
    Screen readers use it as a landmark so users can jump straight to the main
    content without tabbing through navigation first.

    The id="terminal" is used by JavaScript (in input.js) to attach a click
    listener — clicking anywhere inside re-focuses the text input field so
    the user doesn't have to aim at the tiny input box.

    role="main" is redundant with <main> but added for older screen readers
    that don't understand the <main> element natively.
  -->
  <main class="terminal" id="terminal" role="main">

    <!--
      The title bar with the three coloured dots mimics a macOS window.
      These dots don't actually do anything — they're purely decorative.

      The #bar-title span gets its text updated dynamically by JavaScript
      in main.js whenever the user changes directory, so it shows the
      current path like a real terminal window title.
    -->
    <div class="titlebar" aria-label="Terminal title bar">
      <div class="titlebar__dots">
        <span class="dot dot--red"    aria-hidden="true"></span>
        <span class="dot dot--yellow" aria-hidden="true"></span>
        <span class="dot dot--green"  aria-hidden="true"></span>
      </div>
      <span class="titlebar__title" id="bar-title">SLVRD — boot — 80×24</span>
      <!--
        This empty div is a "spacer" — it exists only to push the title text
        into the exact center of the bar. Because we're using flexbox, the dots
        on the left would push the title off-center without something equal on
        the right to balance it. The spacer matches the dot group's width.
      -->
      <div class="titlebar__spacer" aria-hidden="true"></div>
    </div>

    <!--
      The boot section starts visible. boot.js injects animated lines into it
      using staggered setTimeout calls (each line appears after a delay),
      then hides this section and shows #main when the sequence finishes.

      aria-live="polite" tells screen readers to announce new content added
      to this element, but only after the user finishes whatever they're doing
      (polite = wait your turn, vs "assertive" which interrupts immediately).
    -->
    <section class="boot" id="boot" aria-label="Boot sequence" aria-live="polite"></section>

    <!--
      The main shell section starts hidden using the HTML `hidden` attribute.
      We use `hidden` instead of a CSS class like display:none because `hidden`
      also removes the element from the accessibility tree, so screen readers
      won't try to read content the user can't see yet.

      boot.js removes this attribute when the boot animation finishes,
      which triggers the fade-in animation defined in animations.css.
    -->
    <section class="shell" id="main" aria-label="Terminal shell" hidden>

      <!--
        The ASCII art banner content is written by boot.js (not hardcoded here)
        because it's easier to edit a JavaScript string array than to get the
        spacing right inside an HTML file. The <pre> tag preserves whitespace
        exactly as written, which is essential for ASCII art to look right.
      -->
      <div class="banner" id="banner" aria-label="Oliver Pearce banner">
        <pre class="banner__art" id="ascii-art"></pre>
        <p class="banner__sub">
          Type <kbd>help</kbd> to list commands
          &nbsp;·&nbsp;
          Click a button below
        </p>
      </div>

      <!--
        All terminal output (the text that appears when you run commands) is
        injected into this div by output.js. We never write to it directly from
        other files — everything goes through output.js functions instead.

        role="log" is a semantic role that tells screen readers this area
        receives live updates (like a chat log or terminal output).
      -->
      <div class="output" id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>

      <!--
        The input row contains three things laid out as a flex row:
          1. The coloured prompt label (root@oliver:~#) — aria-hidden because
             the input field's aria-label already describes the full context
          2. The actual text input field where you type
          3. A fake blinking cursor (a green rectangle that blinks via CSS)

        The real browser cursor is hidden with caret-color: transparent in CSS
        because we want full control over the cursor's appearance and blink timing.
        The .cursor span is our custom replacement.
      -->
      <div class="input-row">
        <span class="prompt" aria-hidden="true">
          <span class="prompt__user">root</span><span
          class="prompt__at">@</span><span
          class="prompt__host">oliver</span><span
          class="prompt__sep">:</span><span
          class="prompt__path" id="cur-path">~</span><span
          class="prompt__dollar">#</span>
        </span>
        <span class="cursor" aria-hidden="true"></span>
        <input
          class="input-row__field"
          id="cmd-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-label="Terminal command input"
        />
      </div>

      <!--
        The quick-bar is a row of buttons that fire commands without typing.
        Each button stores its command string in a data-cmd attribute — this is
        called a "data attribute", a way to attach custom data to HTML elements.
        JavaScript reads btn.dataset.cmd and submits it as if the user typed it.

        We use <nav> with an aria-label here because this is a navigation region
        (it helps users navigate the terminal's content), making it a discoverable
        landmark for screen reader users.

        NOTE: If you add or remove commands here, also update:
          - the COMMANDS map in js/commands.js
          - the AUTOCOMPLETE_COMMANDS list in js/input.js
          - the cmdHelp() bubbles list in js/commands.js
      -->
      <nav class="quickbar" aria-label="Quick commands">
        <button class="quickbar__btn" data-cmd="whoami">whoami</button>
        <button class="quickbar__btn" data-cmd="ls">ls</button>
        <button class="quickbar__btn" data-cmd="cat resume.txt">cat resume.txt</button>
        <button class="quickbar__btn" data-cmd="cat skills.txt">cat skills.txt</button>
        <button class="quickbar__btn" data-cmd="cat contact.txt">cat contact.txt</button>
        <button class="quickbar__btn" data-cmd="ls projects/">ls projects/</button>
        <button class="quickbar__btn" data-cmd="cat projects/llm-ctf/README.md">cat llm-ctf readme</button>
        <button class="quickbar__btn" data-cmd="cat projects/scmac-ios/README.md">cat scmac readme</button>
        <button class="quickbar__btn" data-cmd="uname -a">uname -a</button>
        <button class="quickbar__btn" data-cmd="help">help</button>
        <button class="quickbar__btn" data-cmd="clear">clear</button>
      </nav>

    </section>
  </main>

  <!-- Floating mobile controls for better touch interaction -->
  <div class="floating-mobile-controls" aria-label="Mobile controls">
    <button class="floating-btn" id="focus-input-btn" title="Focus input for typing" aria-label="Focus terminal input">⌨</button>
  </div>

  <!--
    Scripts are loaded at the BOTTOM of the body (not in <head>) because the
    browser runs JavaScript as soon as it encounters a <script> tag — if scripts
    were in <head>, they'd run before the HTML elements they reference even exist.

    The load order within scripts also matters because each file uses globals
    defined by earlier files:

      data/filesystem.js  → creates the FILESYSTEM global object
      data/files.js       → creates the FILES global object

      js/output.js        → creates Output (needs nothing)
      js/filesystem.js    → creates Filesystem (reads FILESYSTEM + FILES)
      js/commands.js      → creates Commands (uses Output and Filesystem)
      js/boot.js          → creates Boot (standalone, no deps)
      js/input.js         → creates Input (standalone, wired in main.js)
      js/main.js          → the entry point that starts everything
  -->
  <script src="data/filesystem.js"></script>
  <script src="data/files.js"></script>

  <script src="js/output.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
